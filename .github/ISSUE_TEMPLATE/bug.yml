name: Bug report
description: Report a reproducible problem with manually redacted details
body:
  - type: markdown
    attributes:
      value: Do not attach raw logs, credentials, device identifiers, pairing traffic, private APKs or unredacted diagnostics.
  - type: input
    id: version
    attributes:
      label: Hoodini version and installation type
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (without secrets)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and manually redacted evidence
    validations:
      required: true
