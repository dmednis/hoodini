name: Publish image
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Require tag = package = add-on version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          import yaml
          tag = os.environ['TAG']
          package = tomllib.loads(Path('server/pyproject.toml').read_text())['project']['version']
          addon = yaml.safe_load(Path('addon/hoodini/config.yaml').read_text())['version']
          label = re.search(r'org\.opencontainers\.image\.version="([^"]+)"', Path('Dockerfile').read_text())
          if tag != f'v{package}' or str(addon) != package or not label or label.group(1) != package:
              raise SystemExit('Tag, package, add-on and image label versions must agree')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={package}', file=output)
          PY
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/dmednis/hoodini:${{ needs.verify.outputs.version }}
  anonymous-pull:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: docker pull "ghcr.io/dmednis/hoodini:${{ needs.verify.outputs.version }}"
