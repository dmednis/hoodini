<article class="broker-card">
  <header>
    <div class="device-title">
      <h3>MQTT broker</h3>
      <span class="badge $tone">$status</span>
    </div>
  </header>
  <p class="connection-note">$note</p>
  <dl class="readings">
    <div><dt>Broker</dt><dd>$endpoint</dd></div>
    <div><dt>Source</dt><dd>$source</dd></div>
    <div><dt>Status since</dt><dd>$since</dd></div>
    <div><dt>HA seen</dt><dd>$ha</dd></div>
  </dl>
  <p class="subtle connection-note">$ha_note</p>
</article>
